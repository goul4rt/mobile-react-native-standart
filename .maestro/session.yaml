# Full flow: pick a subject, answer in two steps, move on and leave.
appId: org.reactjs.native.example.Gabarita
---
- launchApp:
    clearState: false

# --- subject picker ---
# Opens on Home, which lists the subjects. Restoring the session from storage is
# async, so this waits instead of asserting straight after launch.
- extendedWaitUntil:
    visible:
      id: 'area-MT'
    timeout: 20000
- assertVisible:
    text: '.*questions'
- tapOn:
    id: 'area-MT'

# --- session: "reading" state ---
# The session fetches the questions from the API; waiting is part of the test,
# not flakiness.
- extendedWaitUntil:
    visible: '1/10'
    timeout: 20000
- assertVisible:
    text: 'ENEM \d{4} · Mathematics'
# Before picking an option, the footer does not exist.
- assertNotVisible:
    id: 'answer'

# --- "picked" state: picking is not answering ---
# Questions are drawn at random: with a long stimulus, the options start below
# the fold. Scrolling to them is what the student does too.
- scrollUntilVisible:
    element:
      id: 'choice-A'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'choice-A'
- assertVisible:
    id: 'answer'
- assertVisible: 'Answer'
- assertNotVisible: ".*doesn't have an explanation yet.*"

# --- changing your mind before submitting ---
- scrollUntilVisible:
    element:
      id: 'choice-C'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'choice-C'
- assertVisible:
    id: 'answer'

# --- submit ---
- tapOn:
    id: 'answer'
- assertVisible:
    text: '(Nice! You know this one\.|Close\. The right answer was [A-E]\.)'
- assertVisible: ".*doesn't have an explanation yet.*"
- assertVisible:
    id: 'next'
# Answered: the submit button gave way to the next one.
- assertNotVisible:
    id: 'answer'

# --- move to the next question ---
- tapOn:
    id: 'next'
- extendedWaitUntil:
    visible: '2/10'
    timeout: 10000
- assertNotVisible:
    id: 'next'

# --- leaving goes back to the subject picker ---
- tapOn:
    id: 'close-session'
- extendedWaitUntil:
    visible:
      id: 'area-MT'
    timeout: 10000
