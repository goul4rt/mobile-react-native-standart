# With the API down, the app has to say so -- and not show invented data.
appId: org.reactjs.native.example.Gabarita
# Requires the API to be stopped, so it stays out of the default suite:
#   npm run e2e:offline   (with the API down)
tags:
  - offline
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: ".*You're offline.*"
    timeout: 20000
- assertVisible: '.*saved everything here.*'
# It cannot be a dead end: retrying has to be possible without closing the app.
- assertVisible:
    id: 'try-again'
