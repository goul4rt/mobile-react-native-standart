# Reporting a problem: open the menu, pick a reason, confirm the thank-you.
appId: org.reactjs.native.example.Gabarita
---
- launchApp:
    clearState: false
# Opens on Home, which lists the subjects. Restoring the session from storage is
# async, so this waits instead of asserting straight after launch.
- extendedWaitUntil:
    visible:
      id: 'area-MT'
    timeout: 20000
- tapOn:
    id: 'area-MT'
- extendedWaitUntil:
    visible: '1/10'
    timeout: 20000

- scrollUntilVisible:
    element:
      id: 'report'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'report'

- assertVisible: "What's wrong with this question?"
- assertVisible: 'Wrong answer key'
- tapOn: 'Wrong answer key'
- assertVisible: "We'll review this question."
- tapOn: 'OK'
- assertVisible: '1/10'
