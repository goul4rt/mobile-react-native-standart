# Walks all 10 questions and checks the results screen.
appId: org.reactjs.native.example.Gabarita
---
- launchApp:
    clearState: false
# Opens on Home, which lists the subjects. Restoring the session from storage is
# async, so this waits instead of asserting straight after launch.
- extendedWaitUntil:
    visible:
      id: 'area-MT'
    timeout: 20000
- tapOn:
    id: 'area-CH'
- extendedWaitUntil:
    visible: '1/10'
    timeout: 20000

- repeat:
    times: 10
    commands:
      - scrollUntilVisible:
          element:
            id: 'choice-B'
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: 'choice-B'
      - tapOn:
          id: 'answer'
      - tapOn:
          id: 'next'

# The end: correct plus wrong has to add up to 10.
- extendedWaitUntil:
    visible: 'Session complete'
    timeout: 15000
- assertVisible: 'correct'
- assertVisible: 'wrong'
- assertVisible: 'time'
# Without 30 answers in the population, the comparison is not published.
- assertVisible: '.*We need answers from more students.*'
- assertVisible: '10 more questions'

# Back to the subject picker to start another one.
- tapOn:
    id: 'change-subject'
- assertVisible:
    id: 'area-MT'
