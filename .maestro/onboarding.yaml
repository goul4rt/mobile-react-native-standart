# First run: welcome -> sign up with consent -> home.
appId: org.reactjs.native.example.Gabarita
---
- launchApp:
    clearState: true

- assertVisible: 'Questiona'
- assertVisible: 'Study with ENEM questions. One at a time.'
- tapOn:
    id: 'create-account'

- assertVisible: 'Create account'

# The documents the consent line names have to be reachable from the screen
# itself: without that the user declares having read something they had no way
# to open. Checked before touching the fields, because the keyboard covers this
# part of the screen afterwards.
- assertVisible:
    id: 'link-terms'
- assertVisible:
    id: 'link-privacy'

- tapOn:
    id: 'field-name'
- inputText: 'Ana Souza'
- tapOn:
    id: 'field-email'
# A fresh email every run: signing up twice with the same one returns 409.
- inputText: 'ana-${Date.now()}@exemplo.test'
- tapOn:
    id: 'field-password'
- waitForAnimationToEnd:
    timeout: 3000
- inputText: 'senha-de-teste-123'
- assertVisible:
    id: 'field-password'
    text: '.+'
# LGPD: the button only unlocks after consent.
#
# No `hideKeyboard` here. On iOS it swipes down the screen, and with the English
# strings -- longer than the Portuguese ones -- that swipe lands on the "I
# already have an account" button at the bottom and navigates away. Scrolling to
# the checkbox does the same job without touching anything else.
- scrollUntilVisible:
    element:
      id: 'consent'
    direction: DOWN
    timeout: 10000
- assertVisible: 'The button unlocks once you accept.'
- tapOn:
    id: 'consent'
- assertNotVisible: 'The button unlocks once you accept.'

# The button has to stay reachable even with the keyboard open.
- tapOn:
    id: 'submit-signup'

# Signed in: home with the first name and the subjects.
- extendedWaitUntil:
    visible: 'Hi, Ana'
    timeout: 25000
- assertVisible: '(?i).*study by subject.*'
- assertVisible:
    id: 'tab-stats'
