# Do cadastro às estatísticas: prova que a resposta sai do app, chega na API e
# volta como número na aba de estatísticas.
appId: org.reactjs.native.example.Gabarita
---
- launchApp:
    clearState: true
- tapOn:
    id: 'create-account'
- tapOn:
    id: 'field-name'
- inputText: 'Bruno'
- tapOn:
    id: 'field-email'
- inputText: 'bruno-${Date.now()}@exemplo.test'
- tapOn:
    id: 'field-password'
- waitForAnimationToEnd:
    timeout: 3000
- inputText: 'senha-de-teste-123'
- hideKeyboard
# scrollUntilVisible em vez de tapOn direto: com o teclado recolhendo, o
# checkbox pode ainda estar fora da área visível no instante do toque.
# Espera o teclado terminar de recolher: sem isto o checkbox ainda está
# coberto no instante do toque, e a tela não tem scroll para compensar.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'consent'
- tapOn:
    id: 'submit-signup'
- extendedWaitUntil:
    visible: 'Oi, Bruno'
    timeout: 25000

# Conta nova: nenhuma estatística ainda.
- tapOn:
    id: 'tab-stats'
- assertVisible: '.*Responda algumas questões.*'

# Responde uma sessão inteira.
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'area-MT'
- extendedWaitUntil:
    visible: '1/10'
    timeout: 20000
- repeat:
    times: 10
    commands:
      - scrollUntilVisible:
          element:
            id: 'choice-A'
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: 'choice-A'
      - tapOn:
          id: 'answer'
      - tapOn:
          id: 'next'
- extendedWaitUntil:
    visible: 'Fim da sessão'
    timeout: 15000
# O botão fica desabilitado enquanto o lote sobe; o texto só volta quando acaba.
- extendedWaitUntil:
    visible: 'Voltar pra home'
    timeout: 20000
- tapOn:
    id: 'change-subject'

# De volta na home: o cartão de continuar aparece com o que foi respondido.
- extendedWaitUntil:
    visible: '.*CONTINUAR DE ONDE PAROU.*'
    timeout: 20000
- assertVisible: '.*10 respondidas.*'

# E as estatísticas deixaram de estar vazias.
- tapOn:
    id: 'tab-stats'
- extendedWaitUntil:
    visible: 'ACERTO POR ÁREA'
    timeout: 20000
- assertVisible: '.*de 10 questões.*'
- assertVisible: 'questões respondidas'
- takeScreenshot: /tmp/estatisticas

# A outra aba respeita a amostra mínima da população.
- tapOn:
    id: 'tab-others'
- assertVisible: '.*Comparações são sempre com a média geral.*'
- takeScreenshot: /tmp/comparacao
