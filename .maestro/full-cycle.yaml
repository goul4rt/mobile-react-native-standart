# From sign-up to stats: proves an answer leaves the app, reaches the API and
# comes back as a number on the stats tab.
appId: org.reactjs.native.example.Gabarita
---
- launchApp:
    clearState: true
- tapOn:
    id: 'create-account'
- tapOn:
    id: 'field-name'
- inputText: 'Bruno'
- tapOn:
    id: 'field-email'
- inputText: 'bruno-${Date.now()}@exemplo.test'
- tapOn:
    id: 'field-password'
- waitForAnimationToEnd:
    timeout: 3000
- inputText: 'senha-de-teste-123'
# No `hideKeyboard` -- see the note in onboarding.yaml.
- scrollUntilVisible:
    element:
      id: 'consent'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'consent'
- tapOn:
    id: 'submit-signup'
- extendedWaitUntil:
    visible: 'Hi, Bruno'
    timeout: 25000

# A brand new account: no stats yet. The tab fetches its screen from the Zephyr
# edge on first open, so this waits on a network round trip, not just a render.
- tapOn:
    id: 'tab-stats'
- extendedWaitUntil:
    visible: '.*Answer a few questions.*'
    timeout: 30000

# Answer a whole session. Home loads the subject list from the API, so the
# buttons are not there the instant the tab opens -- and the tap itself has to
# wait for the remote screen to finish mounting, or it gets swallowed.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'tab-home'
- extendedWaitUntil:
    visible:
      id: 'area-MT'
    timeout: 20000
- tapOn:
    id: 'area-MT'
- extendedWaitUntil:
    visible: '1/10'
    timeout: 20000
- repeat:
    times: 10
    commands:
      - scrollUntilVisible:
          element:
            id: 'choice-A'
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: 'choice-A'
      - tapOn:
          id: 'answer'
      - tapOn:
          id: 'next'
- extendedWaitUntil:
    visible: 'Session complete'
    timeout: 15000
# The button stays disabled while the batch uploads; the label only comes back
# once it finishes.
- extendedWaitUntil:
    visible: 'Back to home'
    timeout: 20000
- tapOn:
    id: 'change-subject'

# Back home: the continue card shows up with what was answered.
- extendedWaitUntil:
    visible: '(?i).*pick up where you left off.*'
    timeout: 20000
- assertVisible: '.*10 answered.*'

# And the stats stopped being empty.
- tapOn:
    id: 'tab-stats'
- extendedWaitUntil:
    visible: '(?i).*accuracy by subject.*'
    timeout: 20000
- assertVisible: '.*of 10 questions.*'
- assertVisible: 'questions answered'

# The other tab respects the minimum population sample.
- tapOn:
    id: 'tab-others'
- assertVisible: '.*Comparisons are always against the overall average.*'
