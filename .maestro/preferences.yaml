# Profile preferences: theme, text size and app language.
appId: org.reactjs.native.example.Gabarita
---
- launchApp:
    clearState: false
# Restoring the session from storage is async: tapping straight after launch
# lands on the welcome screen, which has no tabs.
- extendedWaitUntil:
    visible:
      id: 'tab-profile'
    timeout: 20000
- tapOn:
    id: 'tab-profile'
- assertVisible: 'Profile'

# Theme: switching to light changes the screen immediately.
- assertVisible: 'Theme'
- tapOn:
    id: 'theme-light'
- tapOn:
    id: 'theme-dark'

# Text size.
- assertVisible: 'Text size'
- tapOn:
    id: 'scale-xlarge'
- tapOn:
    id: 'scale-normal'

# App language: the whole interface switches to Portuguese.
- assertVisible: 'App language'
- tapOn:
    id: 'app-language-pt'
- assertVisible: 'Perfil'
- assertVisible: 'Idioma do app'
- assertVisible: 'Sair da conta'

# The switch applies to the other tabs too, not just this screen.
- tapOn:
    id: 'tab-home'
- assertVisible: '(?i).*estudar por área.*'
- tapOn:
    id: 'tab-stats'
# The stats screen comes from the Zephyr edge; first open waits on the network.
- extendedWaitUntil:
    visible: 'Estatísticas'
    timeout: 30000
- assertVisible: 'Você e os outros'

# Back to English, and confirm it sticks.
- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'app-language-en'
- assertVisible: 'Profile'
