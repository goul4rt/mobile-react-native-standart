# Preferências do perfil: tema, tamanho de fonte e idioma do app.
appId: org.reactjs.native.example.Gabarita
---
- launchApp:
    clearState: false
- tapOn:
    id: 'tab-profile'
- assertVisible: 'Perfil'

# Tema: trocar para claro muda a tela na hora.
- assertVisible: 'Tema'
- tapOn:
    id: 'theme-light'
- takeScreenshot: /tmp/perfil-claro
- tapOn:
    id: 'theme-dark'

# Tamanho da fonte.
- assertVisible: 'Tamanho da fonte'
- tapOn:
    id: 'scale-xlarge'
- takeScreenshot: /tmp/perfil-fonte

- tapOn:
    id: 'scale-normal'

# Idioma do app: a interface inteira troca para inglês.
- assertVisible: 'Idioma do app'
- tapOn:
    id: 'app-language-en'
- assertVisible: 'Profile'
- assertVisible: 'App language'
- assertVisible: 'Sign out'
- takeScreenshot: /tmp/perfil-ingles

# A troca vale nas outras abas também, não só nesta tela.
- tapOn:
    id: 'tab-home'
- assertVisible: 'STUDY BY SUBJECT'
- tapOn:
    id: 'tab-stats'
- assertVisible: 'Stats'
- assertVisible: 'You and others'

# Volta pro português e confirma que persiste.
- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'app-language-pt'
- assertVisible: 'Perfil'
